<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>06 - Styling Form</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; background: #f9fafb; color: #1f2937; }
  .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h1 { font-size: 1.4rem; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
  .field label { font-weight: 600; font-size: .85rem; color: #374151; }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    transition: border-color .2s, box-shadow .2s; font-size: .95rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  input:invalid:not(:placeholder-shown) { border-color: #ef4444; }
  input:valid:not(:placeholder-shown) { border-color: #22c55e; }
  input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: #3b82f6; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
  button[type="submit"] {
    width: 100%; background: #3b82f6; color: white; border: none; padding: 12px 20px;
    border-radius: 8px; font-weight: 600; cursor: pointer; transition: background .2s; font-size: 1rem;
  }
  button[type="submit"]:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="card">
    <h1>Form Kontak (Sudah Distyling)</h1>
    <form>
      <div class="form-grid">
        <div class="field">
          <label for="depan">Nama Depan</label>
          <input type="text" id="depan" placeholder="Budi" required autocomplete="given-name">
        </div>
        <div class="field">
          <label for="belakang">Nama Belakang</label>
          <input type="text" id="belakang" placeholder="Santoso" required autocomplete="family-name">
        </div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="budi@mail.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" rows="4" placeholder="Tulis pesan..."></textarea>
      </div>
      <button type="submit">Kirim Pesan</button>
    </form>
  </div>
</body>
</html>
