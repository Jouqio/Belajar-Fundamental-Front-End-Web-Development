<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>11 - Club Finder App (Lengkap)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #1f2937; background: #f9fafb; }
  h1 { font-size: 1.4rem; }
  .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-bar input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: .95rem; }
  .search-bar input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .search-bar button { padding: 10px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .filters { display: flex; gap: 12px; margin-bottom: 8px; }
  .filters > div { flex: 1; }
  .filters label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 4px; color: #374151; }
  .filters select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; }
  #reset-btn { background: none; border: 1px solid #d1d5db; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: .8rem; margin-bottom: 16px; }
  #hint { color: #b45309; font-size: .85rem; min-height: 18px; display: block; margin-bottom: 8px; }
  ul#hasil-pencarian { list-style: none; padding: 0; margin: 0; }
  ul#hasil-pencarian li { padding: 12px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  ul#hasil-pencarian li:last-child { border-bottom: none; }
  .badge { background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 999px; font-size: .75rem; text-transform: capitalize; }
  .lokasi { color: #6b7280; font-size: .85rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
</head>
<body>
  <h1>🔍 Club Finder App</h1>
  <div class="card">
    <form id="search-form" role="search">
      <div class="search-bar">
        <label for="keyword" class="sr-only">Cari klub</label>
        <input
          type="search"
          id="keyword"
          name="keyword"
          placeholder="Cari nama klub... (misal: 'klub')"
          list="club-suggestions"
          autocomplete="off">
        <datalist id="club-suggestions">
          <option value="Klub Coding Bontang">
          <option value="Klub Lari Pagi">
          <option value="Klub Baca Buku">
          <option value="Komunitas Web Developer Kaltim">
        </datalist>
        <button type="submit">Cari</button>
      </div>
      <span id="hint"></span>

      <div class="filters">
        <div>
          <label for="kategori">Kategori</label>
          <select id="kategori" name="kategori">
            <option value="">Semua</option>
            <option value="olahraga">Olahraga</option>
            <option value="teknologi">Teknologi</option>
            <option value="seni">Seni</option>
          </select>
        </div>
        <div>
          <label for="kota">Kota</label>
          <select id="kota" name="kota">
            <option value="">Semua</option>
            <option value="bontang">Bontang</option>
            <option value="balikpapan">Balikpapan</option>
            <option value="samarinda">Samarinda</option>
          </select>
        </div>
      </div>
      <button type="button" id="reset-btn">Reset Filter</button>
    </form>

    <ul id="hasil-pencarian" aria-live="polite"></ul>
  </div>

<script>
const daftarKlub = [
  { nama: "Klub Coding Bontang", kategori: "teknologi", kota: "bontang" },
  { nama: "Klub Lari Pagi", kategori: "olahraga", kota: "bontang" },
  { nama: "Klub Baca Buku", kategori: "seni", kota: "balikpapan" },
  { nama: "Komunitas Web Developer Kaltim", kategori: "teknologi", kota: "samarinda" },
  { nama: "Klub Futsal Anak Muda", kategori: "olahraga", kota: "balikpapan" },
  { nama: "Sanggar Lukis Kreatif", kategori: "seni", kota: "samarinda" },
];

const form = document.getElementById('search-form');
const keywordInput = document.getElementById('keyword');
const kategoriSelect = document.getElementById('kategori');
const kotaSelect = document.getElementById('kota');
const hintEl = document.getElementById('hint');

function debounce(fn, delay = 300) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

function cariKlub({ keyword = "", kategori = "", kota = "" }) {
  return daftarKlub.filter((klub) => {
    const cocokKeyword = klub.nama.toLowerCase().includes(keyword.toLowerCase());
    const cocokKategori = kategori === "" || klub.kategori === kategori;
    const cocokKota = kota === "" || klub.kota === kota;
    return cocokKeyword && cocokKategori && cocokKota;
  });
}

function renderHasil(hasil) {
  const container = document.getElementById('hasil-pencarian');
  if (hasil.length === 0) {
    container.innerHTML = `<li role="alert">Tidak ada klub ditemukan.</li>`;
    return;
  }
  container.innerHTML = hasil.map((klub) => `
      <li>
        <strong>${klub.nama}</strong>
        <span class="badge">${klub.kategori}</span>
        <span class="lokasi">📍 ${klub.kota}</span>
      </li>`).join('');
}

function jalankanPencarian() {
  const keyword = keywordInput.value.trim();

  if (keyword.length === 1) {
    hintEl.textContent = 'Ketik minimal 2 karakter untuk hasil lebih akurat';
    return;
  }
  hintEl.textContent = '';

  const hasil = cariKlub({
    keyword,
    kategori: kategoriSelect.value,
    kota: kotaSelect.value,
  });
  renderHasil(hasil);
}

keywordInput.addEventListener('input', debounce(jalankanPencarian, 300));
kategoriSelect.addEventListener('change', jalankanPencarian);
kotaSelect.addEventListener('change', jalankanPencarian);

form.addEventListener('submit', (e) => {
  e.preventDefault();
  jalankanPencarian();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  keywordInput.value = '';
  kategoriSelect.value = '';
  kotaSelect.value = '';
  hintEl.textContent = '';
  renderHasil(daftarKlub);
});

renderHasil(daftarKlub);
</script>
</body>
</html>
