<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>01 - Pendalaman Elemen Form</title>
<link rel="stylesheet" href="01 elemen form.css">
</head>
<body>
  <h1>Pendaftaran Webinar</h1>
  <form oninput="totalPeserta.value = parseInt(jumlah.value || 0)">
    <fieldset>
      <legend>Data Peserta</legend>

      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" required>

      <label for="kota">Kota Asal</label>
      <input list="daftar-kota" id="kota" name="kota" placeholder="Ketik atau pilih kota">
      <datalist id="daftar-kota">
        <option value="Bontang">
        <option value="Balikpapan">
        <option value="Samarinda">
        <option value="Jakarta">
      </datalist>

      <label for="topik">Topik Webinar</label>
      <select id="topik" name="topik">
        <optgroup label="Teknologi">
          <option value="web-dev">Web Development</option>
          <option value="ai">Kecerdasan Buatan</option>
        </optgroup>
        <optgroup label="Lingkungan">
          <option value="energi-surya">Energi Surya</option>
        </optgroup>
      </select>

      <label for="jumlah">Jumlah Peserta yang Diwakilkan</label>
      <input type="number" id="jumlah" name="jumlah" min="1" max="5" value="1">
      Total: <output name="totalPeserta" for="jumlah">1</output> orang

      <label for="pesan">Pertanyaan / Catatan</label>
      <textarea id="pesan" name="pesan" rows="3" placeholder="Tulis di sini..."></textarea>
    </fieldset>

    <button type="submit">Daftar Sekarang</button>
  </form>
</body>
</html>
