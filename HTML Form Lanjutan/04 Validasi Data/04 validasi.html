<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>04 - Validasi Data</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: .9rem; }
  input { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; width: 100%; box-sizing: border-box; }
  input:invalid:not(:placeholder-shown) { border-color: #ef4444; }
  input:valid:not(:placeholder-shown) { border-color: #22c55e; }
  .error { color: #ef4444; font-size: .85rem; min-height: 18px; display: block; margin-top: 4px; }
  button { margin-top: 8px; padding: 10px 18px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Form Registrasi (dengan Validasi)</h1>
  <form id="regForm" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Minimal 4 karakter" required>
      <span class="error" id="err-username"></span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="nama@mail.com" required>
      <span class="error" id="err-email"></span>
    </div>

    <div class="field">
      <label for="pass">Password (min 8 karakter)</label>
      <input type="password" id="pass" name="pass" minlength="8" required>
      <span class="error" id="err-pass"></span>
    </div>

    <div class="field">
      <label for="confirmPass">Konfirmasi Password</label>
      <input type="password" id="confirmPass" name="confirmPass" required>
      <span class="error" id="err-confirm"></span>
    </div>

    <button type="submit">Daftar</button>
  </form>

<script>
const username = document.getElementById('username');
const email = document.getElementById('email');
const pass = document.getElementById('pass');
const confirmPass = document.getElementById('confirmPass');
const form = document.getElementById('regForm');

username.addEventListener('input', () => {
  if (username.validity.valueMissing) {
    document.getElementById('err-username').textContent = 'Username wajib diisi';
  } else if (username.value.length < 4) {
    document.getElementById('err-username').textContent = 'Username minimal 4 karakter';
  } else {
    document.getElementById('err-username').textContent = '';
  }
});

email.addEventListener('input', () => {
  document.getElementById('err-email').textContent = email.validity.typeMismatch
    ? 'Format email tidak valid' : '';
});

function cekPassword() {
  if (pass.value.length > 0 && pass.value.length < 8) {
    document.getElementById('err-pass').textContent = 'Password minimal 8 karakter';
  } else {
    document.getElementById('err-pass').textContent = '';
  }
  if (confirmPass.value && pass.value !== confirmPass.value) {
    document.getElementById('err-confirm').textContent = 'Password tidak cocok';
  } else {
    document.getElementById('err-confirm').textContent = '';
  }
}
pass.addEventListener('input', cekPassword);
confirmPass.addEventListener('input', cekPassword);

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (form.checkValidity() && pass.value === confirmPass.value && username.value.length >= 4) {
    alert('Registrasi berhasil (simulasi)!');
  } else {
    alert('Masih ada input yang belum valid, cek kembali ya.');
  }
});
</script>
</body>
</html>
