<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tantangan: Image Card dengan Slot</title>
<style>
  body { font-family: sans-serif; padding: 20px; display: flex; gap: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
  <image-card>
    <img slot="image" src="https://picsum.photos/220/150?1" alt="Contoh gambar">
    <span slot="caption">Pemandangan gunung</span>
  </image-card>

  <image-card>
    <img slot="image" src="https://picsum.photos/220/150?2" alt="Contoh gambar">
  </image-card>
<script src="main.js"></script>
</body>
</html>
