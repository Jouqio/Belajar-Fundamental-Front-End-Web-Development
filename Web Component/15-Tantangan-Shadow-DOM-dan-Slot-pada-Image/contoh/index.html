<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tantangan: Image Card dengan Slot</title>
<style>
  body { font-family: sans-serif; padding: 20px; display: flex; gap: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
  <image-card>
    <img slot="image" src="https://picsum.photos/220/150?1" alt="Contoh gambar">
    <span slot="caption">Pemandangan gunung</span>
  </image-card>

  <image-card>
    <img slot="image" src="https://picsum.photos/220/150?2" alt="Contoh gambar">
  </image-card>

  <script>
    class ImageCard extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = `
          <style>
            .card {
              width: 220px;
              border: 1px solid #ddd;
              border-radius: 10px;
              overflow: hidden;
            }
            ::slotted(img) { width: 100%; display: block; }
            .caption { padding: 10px; font-size: 14px; color: #444; }
          </style>
          <div class="card">
            <slot name="image"></slot>
            <div class="caption">
              <slot name="caption">Tanpa keterangan</slot>
            </div>
          </div>
        `;
      }
    }
    customElements.define('image-card', ImageCard);
  </script>
</body>
</html>
