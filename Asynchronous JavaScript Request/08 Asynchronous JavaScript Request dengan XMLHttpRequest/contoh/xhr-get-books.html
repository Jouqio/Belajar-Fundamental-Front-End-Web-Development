<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>XHR: Mengambil Daftar Buku</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  #hasil { margin-top: 16px; }
  .book { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .status { font-weight: bold; }
</style>
</head>
<body>
  <h2>Daftar Buku (via XMLHttpRequest)</h2>
  <p>Pastikan server latihan sudah berjalan di <code>http://localhost:3000</code></p>
  <p class="status" id="status">Memuat data...</p>
  <div id="hasil"></div>

  <script>
    const statusEl = document.getElementById('status');
    const hasilEl = document.getElementById('hasil');

    const xhr = new XMLHttpRequest();
    xhr.open('GET', 'http://localhost:3000/books');

    xhr.onload = function () {
      if (xhr.status === 200) {
        const data = JSON.parse(xhr.responseText);
        statusEl.textContent = `Berhasil! Status: ${xhr.status}`;

        data.books.forEach((book) => {
          const div = document.createElement('div');
          div.className = 'book';
          div.innerHTML = `<b>${book.title}</b> oleh ${book.author} (${book.year})`;
          hasilEl.appendChild(div);
        });
      } else {
        statusEl.textContent = `Request gagal dengan status: ${xhr.status}`;
      }
    };

    xhr.onerror = function () {
      statusEl.textContent = 'Terjadi kesalahan jaringan. Pastikan server latihan sudah berjalan (node server.js).';
    };

    console.log('1. Sebelum xhr.send() dipanggil');
    xhr.send();
    console.log('2. Baris ini tercetak duluan -- request berjalan di latar belakang (asynchronous)');
  </script>
</body>
</html>
