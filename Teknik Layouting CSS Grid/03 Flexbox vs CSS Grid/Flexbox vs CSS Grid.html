<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flexbox vs CSS Grid</title>
<link rel="stylesheet" href="Flexbox vs CSS Grid.css">
</head>
<body>
  <h3>Flexbox (1 Dimensi)</h3>
  <div class="flex-container">
    <div>Menu 1</div>
    <div>Menu 2</div>
    <div>Menu 3</div>
  </div>

  <h3>CSS Grid (2 Dimensi)</h3>
  <div class="grid-container">
    <div style="grid-column: 1 / 3;">Header</div>
    <div>Sidebar</div>
    <div>Konten</div>
    <div style="grid-column: 1 / 3;">Footer</div>
  </div>
</body>
</html>
