<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tentukan Kolom dan Baris</title>
<link rel="stylesheet" href="Tentukan Kolom dan Baris.css">
</head>
<body>
  <h4>Kolom ukuran tetap + fleksibel</h4>
  <div class="grid1">
    <div>100px</div><div>200px</div><div>1fr</div>
    <div>A</div><div>B</div><div>C</div>
    <div>D</div><div>E</div><div>F</div>
  </div>

  <h4>Unit fr (1fr 2fr 1fr)</h4>
  <div class="grid2">
    <div>1fr</div><div>2fr (lebih lebar)</div><div>1fr</div>
  </div>

  <h4>Responsif otomatis dengan auto-fit + minmax</h4>
  <div class="grid3">
    <div>Kartu 1</div><div>Kartu 2</div><div>Kartu 3</div>
    <div>Kartu 4</div><div>Kartu 5</div>
  </div>
</body>
</html>
